name: CI

# Tests de l'API sur une vraie base PostgreSQL et construction du site, à chaque push et pull request.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: losto
          POSTGRES_PASSWORD: losto
          POSTGRES_DB: losto_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://losto:losto@localhost:5432/losto_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p apps/api/tsconfig.json
      - run: npm test
      - run: npm run build
